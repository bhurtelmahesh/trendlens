<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Not found — TrendLens</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
:root{--bg:#0c0f13;--panel:#12161c;--line:#222b36;--text:#e7ecf1;--muted:#8b949e;--accent:#e0a52b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);
  font:15px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;padding:24px}
main{max-width:440px;text-align:center}
.code{font:600 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em;color:var(--accent);margin:0 0 18px}
h1{margin:0;font-size:28px;letter-spacing:-.01em}
p{color:var(--muted);margin:14px 0 0}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:28px}
a{display:inline-block;padding:12px 18px;border-radius:8px;text-decoration:none;font-weight:600;font-size:14px}
.primary{background:var(--accent);color:var(--bg)}
.secondary{border:1px solid var(--line);color:var(--text)}
a:hover{opacity:.88}
a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
  <main>
    <p class="code">404 &middot; NOT FOUND</p>
    <h1>That page isn&rsquo;t here</h1>
    <p>The link may be out of date, or the address mistyped.</p>
    <div class="actions">
      <a class="primary" href="/">Read a ticker</a>
      <a class="secondary" href="/guide.html">Tutorial</a>
    </div>
  </main>
</body>
</html>

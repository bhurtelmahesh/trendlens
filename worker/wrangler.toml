name = "chartlens2-api"
main = "src/index.ts"
compatibility_date = "2026-08-30"

# 60 requests / 60s per client IP. Free, no KV. src/index.ts also keeps a
# per-isolate fallback in case the binding is unavailable.
[[ratelimits]]
name = "MARKET_RL"
namespace_id = "2001"
simple = { limit = 60, period = 60 }
